name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2026-09：加入 windows-latest —— 生态里已有多起 Windows 平台缺陷报告
        # （#6644 git-bash 路径形态、#6649 NTFS 时间戳抖动与非 C: 盘的模块解析回退），
        # 而本工具声称覆盖 win32（catalog 的 when.os 含 win32）。只在 ubuntu 上跑等于没验证过这个声明。
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']   # 20.x 无 zlib zstd（E12 会正确报出），单列观察价值低于成本
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install zstd
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install zstd --no-progress -y || echo "zstd install failed; zstd-gated tests will skip"
          else
            sudo apt-get update && sudo apt-get install -y zstd
          fi
      - name: Show runtime
        shell: bash
        run: node --version && (zstd --version || echo "no zstd")
      - name: Run the test suite
        shell: bash
        run: node --test plugin/test/*.mjs
