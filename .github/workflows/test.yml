name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install zstd (session logs are zstd-compressed)
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Show runtime versions
        run: node --version && zstd --version
      # 2026-09 起套件是**全绿**的：此前 E4 在合成 HOME（无 node_modules）里报"未找到 node-pty"，
      # 连累 E2/E5/envelope 三个用例。那是检查的语义错误（无对象可查 ⇒ 应 skip 而非 fail），
      # 已修。因此这里可以直接要求 0 失败——不再需要"已知环境失败"的豁免。
      - name: Run the test suite
        run: node --test plugin/test/*.mjs
